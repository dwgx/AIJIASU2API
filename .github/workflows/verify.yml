# Reusable verification workflow: the single full gate that must pass before
# any release asset or container image is produced.
#
# ci.yml, package.yml and release.yml all call this workflow, so a tag run
# executes exactly the checks a pull request executes. A suite cannot be
# dropped by editing one caller, and "same suites" is structural rather than
# a comment that can drift.
#
# The gate includes:
#   lint    — third-party action pins (R6) and required notice files (R2)
#   go      — vet/test daemon + emulator, plus govulncheck (R1). Every Go
#             module declares `go 1.26.10`, so setup-go installs that patched
#             toolchain from the module file rather than a floating major tag.
#   web     — lockfile provenance + negative control, runtime npm audit,
#             generated-doc check, serial tests, live production build (R5)
#   sdk     — Go and TypeScript SDK checks
#   prod-kit — real root production-kit gate on Ubuntu (R5)
#
# setup-go caching stays off: daemon/go.sum exists but the emulator and
# sdk/go modules have no dependency file, and the action's default cache
# fails hard when that file is missing. The suites resolve in seconds.

name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Release hygiene (action pins + notices)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify third-party action pins (R6)
        run: bash scripts/check-workflow-pins.sh

      - name: Verify third-party notice files (R2)
        # package.sh asserts the actual tar members while packaging; this
        # static half fails earlier when a file or a packaging reference is
        # dropped, so a release cannot ship without the notices.
        run: |
          for f in LICENSE NOTICE THIRD-PARTY-NOTICES.md; do
            if [ ! -s "$f" ]; then
              echo "missing or empty notice file: $f" >&2
              exit 1
            fi
          done
          grep -q 'THIRD-PARTY-NOTICES.md' deploy/package.sh
          grep -q 'THIRD-PARTY-NOTICES.md' daemon/Dockerfile
          grep -q 'THIRD-PARTY-NOTICES.md' dashboard/Dockerfile

  go:
    name: Go tests (daemon + emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Vet daemon
        working-directory: daemon
        run: go vet ./...

      - name: Test daemon
        working-directory: daemon
        run: go test -race -count=1 ./...

      - name: Govulncheck (release gate)
        # Pinned tool version: the scanner is part of the supply chain too.
        # It exits non-zero when the code is affected by a known vulnerability.
        working-directory: daemon
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Vet emulator
        working-directory: emulator
        run: go vet ./...

      - name: Test emulator
        working-directory: emulator
        run: go test -race -count=1 ./...

  web:
    name: Web tests (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile metadata
        run: npm run verify:lockfile

      - name: Negative control (empty lockfile is rejected)
        # A verifier that passes an empty package map is decoration; prove the
        # red path here so the guard cannot regress silently.
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/scripts"
          cp scripts/verify-lockfile.mjs "$tmp/scripts/"
          printf '{"lockfileVersion":3,"packages":{}}' > "$tmp/package-lock.json"
          if node "$tmp/scripts/verify-lockfile.mjs"; then
            echo 'negative control failed: an empty lockfile was accepted'
            exit 1
          fi

      - name: Audit runtime dependencies
        # Runtime-only audit: dev test tooling is not shipped to a browser.
        run: npm audit --omit=dev

      - name: Verify generated docs are current
        # The docs UI ships generated artifacts (src/docs/reference.generated.ts,
        # public/docs/*.md, public/llms.txt). --check compares what is on disk
        # and exits 1 on drift instead of rewriting it, so a stale or
        # hand-edited mirror cannot reach the portal edge.
        run: npm run docs:gen -- --check

      # The serial flags are load-bearing: without them findBy* assertions
      # time out on a loaded host (7 of 500 fail on a 24-core machine).
      - name: Test (serial, as CI)
        run: npm test -- --pool=forks --maxWorkers=1

      - name: Build (live mode)
        run: VITE_USE_MOCK=false VITE_API_BASE= npm run build

  sdk:
    name: SDK tests (Go + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Vet Go SDK
        working-directory: sdk/go
        run: go vet ./...

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test -race -count=1 ./...

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/ts
        run: npm ci --no-audit --no-fund

      - name: Typecheck TypeScript SDK
        working-directory: sdk/ts
        run: npm run typecheck

      - name: Test TypeScript SDK
        working-directory: sdk/ts
        run: npm test

  prod-kit:
    name: Production deploy kit (real nginx -t)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnginx-mod-stream nftables python3-yaml
          sudo systemctl stop nginx || true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Build daemon for the /readyz proof
        working-directory: daemon
        run: go build -o ajs-accountd ./cmd/ajs-accountd

      - name: Create the daemon identity for the renderer proof
        # deploy/production/README.md installs this user in step 1; the
        # AJS-412 proof reads the hash file as the unit's User=/Group=.
        run: |
          sudo groupadd --system ajs
          sudo useradd --system --gid ajs --no-create-home --shell /usr/sbin/nologin ajs

      - name: Run production gate (intentional root for ownership checks)
        # The AJS-412 renderer proof creates root-owned 0640/0600 artifacts,
        # proves the nginx worker can read them, and proves the daemon identity
        # (User=/Group= from the unit) can read the hash file. Run the whole
        # gate as root so the CI result is a real production PASS, never a
        # non-root false PASS.
        run: sudo -E bash deploy/production/check.sh

      - name: Negative control (broken temp dir cannot yield a PASS)
        # The systemd unit check must fail closed. With mktemp broken the gate
        # must print the setup FAIL and exit non-zero, never omit the check and
        # still print PASS.
        run: |
          stub=$(mktemp -d)
          printf '#!/bin/sh\nexit 1\n' > "$stub/mktemp"
          chmod 0755 "$stub/mktemp"
          set +e
          sudo env PATH="$stub:$PATH" bash deploy/production/check.sh > /tmp/ajs-negative.log 2>&1
          rc=$?
          set -e
          cat /tmp/ajs-negative.log
          test "$rc" -ne 0
          grep -qF 'FAIL  cannot create a temporary directory for systemd-analyze verify' /tmp/ajs-negative.log
          if grep -qF 'check: PASS' /tmp/ajs-negative.log; then
            echo 'negative control failed: the gate printed PASS without a temp dir'
            exit 1
          fi
