# CI: run the full test suites on every push and pull request.
#
# go  — daemon + emulator: go vet and go test -race in both Go modules.
# web — dashboard: npm ci, vitest run, live production build.
# sdk — Go and TypeScript SDKs: go vet/test, npm ci, tsc typecheck, node --test.
# kit — production deploy-kit gate on Ubuntu with real nginx, systemd and nft,
#       run as root via sudo -E for the AJS-412 renderer ownership proof.
#
# - daemon/go.mod and emulator/go.mod pin the same toolchain (go 1.26.0),
#   so one setup-go with go-version-file: daemon/go.mod covers both modules.
# - daemon/go.sum is committed and pins golang.org/x/crypto (+ x/sys indirect),
#   so a cold module cache needs the proxy once; emulator/ and sdk/go/ have no
#   external dependencies and no go.sum.
# - setup-go cache is disabled: the dependency files differ per module and
#   sdk/go has none, and the action's default cache: true fails hard when the
#   dependency file is missing. The modules resolve in seconds.
# - The dashboard lockfile is committed; every install uses `npm ci` so a
#   fresh checkout resolves exactly the reviewed dependency tree.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests (daemon + emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Vet daemon
        working-directory: daemon
        run: go vet ./...

      - name: Test daemon
        working-directory: daemon
        run: go test -race -count=1 ./...

      - name: Vet emulator
        working-directory: emulator
        run: go vet ./...

      - name: Test emulator
        working-directory: emulator
        run: go test -race -count=1 ./...

  web:
    name: Web tests (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile metadata
        run: npm run verify:lockfile

      - name: Negative control (empty lockfile is rejected)
        # A verifier that passes an empty package map is decoration; prove the
        # red path here so the guard cannot regress silently.
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/scripts"
          cp scripts/verify-lockfile.mjs "$tmp/scripts/"
          printf '{"lockfileVersion":3,"packages":{}}' > "$tmp/package-lock.json"
          if node "$tmp/scripts/verify-lockfile.mjs"; then
            echo 'negative control failed: an empty lockfile was accepted'
            exit 1
          fi

      - name: Test
        run: npm test -- --pool=forks --maxWorkers=1

      - name: Build (live mode)
        run: VITE_USE_MOCK=false VITE_API_BASE= npm run build

  sdk:
    name: SDK tests (Go + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Vet Go SDK
        working-directory: sdk/go
        run: go vet ./...

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test -race -count=1 ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/ts
        run: npm ci --no-audit --no-fund

      - name: Typecheck TypeScript SDK
        working-directory: sdk/ts
        run: npm run typecheck

      - name: Test TypeScript SDK
        working-directory: sdk/ts
        run: npm test

  prod-kit:
    name: Production deploy kit (real nginx -t)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx nftables python3-yaml
          sudo systemctl stop nginx || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Build daemon for the /readyz proof
        working-directory: daemon
        run: go build -o ajs-accountd ./cmd/ajs-accountd

      - name: Create the daemon identity for the renderer proof
        # deploy/production/README.md installs this user in step 1; the
        # AJS-412 proof reads the hash file as the unit's User=/Group=.
        run: |
          sudo groupadd --system ajs
          sudo useradd --system --gid ajs --no-create-home --shell /usr/sbin/nologin ajs

      - name: Run production gate (intentional root for ownership checks)
        # The AJS-412 renderer proof creates root-owned 0640/0600 artifacts,
        # proves the nginx worker can read them, and proves the daemon identity
        # (User=/Group= from the unit) can read the hash file. Run the whole
        # gate as root so the CI result is a real production PASS, never a
        # non-root false PASS.
        run: sudo -E bash deploy/production/check.sh

      - name: Negative control (broken temp dir cannot yield a PASS)
        # The systemd unit check must fail closed. With mktemp broken the gate
        # must print the setup FAIL and exit non-zero, never omit the check and
        # still print PASS.
        run: |
          stub=$(mktemp -d)
          printf '#!/bin/sh\nexit 1\n' > "$stub/mktemp"
          chmod 0755 "$stub/mktemp"
          set +e
          sudo env PATH="$stub:$PATH" bash deploy/production/check.sh > /tmp/ajs-negative.log 2>&1
          rc=$?
          set -e
          cat /tmp/ajs-negative.log
          test "$rc" -ne 0
          grep -qF 'FAIL  cannot create a temporary directory for systemd-analyze verify' /tmp/ajs-negative.log
          if grep -qF 'check: PASS' /tmp/ajs-negative.log; then
            echo 'negative control failed: the gate printed PASS without a temp dir'
            exit 1
          fi
