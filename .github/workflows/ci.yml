# CI: run the full release gate on every push and pull request.
#
# The gate itself lives in verify.yml and is called by ci.yml, package.yml and
# release.yml alike. That is deliberate: ordinary CI and a tag run execute the
# same lockfile checks, runtime npm audit, generated-doc check, serial tests,
# live build, Go vet/test, govulncheck and root production-kit gate. A check
# cannot be dropped from the release path without also dropping it here.
#
# - daemon/go.mod, emulator/go.mod and sdk/go/go.mod require the same patched
#   toolchain (go 1.26.10); setup-go reads the module file it builds.
# - daemon/go.sum is committed and pins golang.org/x/crypto (+ x/sys indirect),
#   so a cold module cache needs the proxy once; emulator/ and sdk/go/ have no
#   external dependencies and no go.sum.
# - setup-go cache is disabled: the dependency files differ per module and
#   sdk/go has none, and the action's default cache: true fails hard when the
#   dependency file is missing. The modules resolve in seconds.
# - The dashboard lockfile is committed; every install uses `npm ci` so a
#   fresh checkout resolves exactly the reviewed dependency tree.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
