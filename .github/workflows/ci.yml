# CI: run the full test suites on every push and pull request.
#
# go  — daemon + emulator: go vet and go test -race in both Go modules.
# web — dashboard: install, vitest run, production build.
#
# - daemon/go.mod and emulator/go.mod pin the same toolchain (go 1.26.0),
#   so one setup-go with go-version-file: daemon/go.mod covers both modules.
# - setup-go cache is disabled: neither module has a go.sum (zero external
#   dependencies), and the action's default cache: true fails hard when the
#   dependency file is missing. There is nothing to cache anyway.
# - The dashboard has no committed lockfile, so `npm ci` cannot run on a
#   fresh checkout; `npm install` resolves from package.json (same approach
#   as release.yml). The npm cache is keyed on dashboard/package.json.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests (daemon + emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Vet daemon
        working-directory: daemon
        run: go vet ./...

      - name: Test daemon
        working-directory: daemon
        run: go test -race -count=1 ./...

      - name: Vet emulator
        working-directory: emulator
        run: go vet ./...

      - name: Test emulator
        working-directory: emulator
        run: go test -race -count=1 ./...

  web:
    name: Web tests (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
