# Release pipeline: on a pushed v* tag, build both images, push them to
# GHCR, and attach the accountd binary plus the dashboard bundle to a
# GitHub Release. No owner/repo is hard-coded: everything derives from
# github.repository_owner / github.repository so the workflow works
# unchanged on any fork.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Images (lowercased owner, as GHCR requires):
#   ghcr.io/<owner>/ajs-accountd:<tag>   and :latest
#   ghcr.io/<owner>/ajs-dashboard:<tag>  and :latest
#
# Release assets:
#   ajs-accountd-linux-amd64   (static CGO_ENABLED=0 binary)
#   dashboard-dist.tar.gz      (the Vite build output, mock mode default)

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  # GHCR requires lowercase image namespaces even when the owner has
  # uppercase letters; evaluate once here and reuse in every step.
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        id: owner
        run: echo "lower=${GHCR_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build dashboard bundle
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package dashboard bundle
        run: tar -czf dashboard-dist.tar.gz -C dashboard/dist .

      - name: Build accountd binary (linux-amd64)
        run: |
          cd daemon
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o ../ajs-accountd-linux-amd64 ./cmd/ajs-accountd

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # daemon/go.mod replaces ajsproxy => ../emulator, so the accountd
      # build context is the repository root, not daemon/.
      - name: Build and push accountd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: daemon/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:latest

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:latest

      - name: Generate release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "## Images"
            echo ''
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:${{ github.ref_name }}`'
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:latest`'
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:${{ github.ref_name }}`'
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:latest`'
            echo ''
            echo '## Update on HMC'
            echo ''
            echo '```bash'
            echo 'cd deploy && ./update.sh --tag ${{ github.ref_name }}'
            echo '```'
            echo ''
            echo 'Roll back with `./update.sh --rollback`.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            ajs-accountd-linux-amd64
            dashboard-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
