# Release pipeline: on a pushed v* tag, build both images and push them to
# GHCR. No owner/repo is hard-coded: everything derives from
# github.repository_owner / github.repository so the workflow works
# unchanged on any fork.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Images (lowercased owner, as GHCR requires):
#   ghcr.io/<owner>/ajs-accountd:<tag>   (:latest only for final tags)
#   ghcr.io/<owner>/ajs-dashboard:<tag>  (:latest only for final tags)
# A pre-release tag (one containing "-") never moves :latest.
#
# Platform binaries and the dashboard bundle are built and attached by
# package.yml on the same tag. This workflow attaches no release assets, so
# that workflow's SHA256SUMS always describes the complete asset set.
#
# The `release` job needs the `verify` job (the reusable verify.yml full
# gate: pins, notices, govulncheck, lockfile/audit, live build, production
# kit), so a red suite cannot push a tag image or move :latest.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  # GHCR requires lowercase image namespaces even when the owner has
  # uppercase letters; evaluate once here and reuse in every step.
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  verify:
    name: Verify suites
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase GHCR owner
        id: owner
        run: echo "lower=${GHCR_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # daemon/go.mod replaces ajsproxy => ../emulator, so the accountd
      # build context is the repository root, not daemon/.
      - name: Build and push accountd image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: daemon/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:${{ github.ref_name }}

      # The dashboard image also needs the root LICENSE/NOTICE files, so its
      # build context is the repository root too.
      - name: Build and push dashboard image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          build-args: |
            VITE_USE_MOCK=false
            VITE_API_BASE=
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:${{ github.ref_name }}

      # A pre-release tag (for example v0.1.0-pre) must not move :latest: the
      # alias stays on the last stable image. Only a final tag promotes the
      # immutable tag image to :latest, and it does so by adding an alias to
      # the already-pushed manifest rather than rebuilding.
      - name: Move accountd :latest (final releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:latest \
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:${{ github.ref_name }}

      - name: Move dashboard :latest (final releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:latest \
            ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:${{ github.ref_name }}

      - name: Generate release notes
        id: notes
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) is_prerelease=1 ;;
            *)   is_prerelease=0 ;;
          esac
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "## Images"
            echo ''
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:${{ github.ref_name }}`'
            echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:${{ github.ref_name }}`'
            if [ "$is_prerelease" = 0 ]; then
              echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-accountd:latest`'
              echo '- `ghcr.io/${{ steps.owner.outputs.lower }}/ajs-dashboard:latest`'
            fi
            echo ''
            echo '## Update on HMC'
            echo ''
            echo '```bash'
            echo 'cd deploy && ./update.sh --tag ${{ github.ref_name }}'
            echo '```'
            echo ''
            echo 'Roll back with `./update.sh --rollback`.'
            if [ "$is_prerelease" = 1 ]; then
              echo ''
              echo 'Pre-release: the `:latest` image tags are unchanged.'
            fi
            echo ''
            echo '## Platform artifacts'
            echo ''
            echo 'The package workflow attaches `ajs-accountd-linux-amd64`,'
            echo '`ajs-accountd-windows-amd64.exe`, `ajs-accountd-darwin-arm64`,'
            echo '`dashboard-dist.tar.gz`, `MANIFEST.txt` and `SHA256SUMS` to this release.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
