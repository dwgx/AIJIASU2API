# Internal origin for the public API edge on the Tokyo VPS.
# The VPS terminates TLS and enforces the 41-path allowlist; this server only
# reaches the daemon on loopback and is not exposed to the internet.
server {
    listen 80;
    server_name ajs.dwgx.top 10.99.0.2;

    # Only the VPS WireGuard peer and localhost may use this internal origin.
    # LAN clients must not reach the admin/portal/payment /v1/ surface here.
    allow 10.99.0.1;
    allow 127.0.0.1;
    deny all;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /tunnel {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # The public allowlist exposes GET /metrics with a metrics:read key.
    location = /metrics {
        proxy_pass http://127.0.0.1:2261;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:2261;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
        proxy_send_timeout 60s;
    }

    location / { return 404; }
}
