upstream ajs_accountd {
    server 10.99.0.2:80;
    keepalive 16;
}

server {
    listen      2055 ssl http2;
    # listen      [::]:443 ssl http2;   # uncomment on an IPv6-enabled host
    server_name ajs.dwgx.top;

    root  /var/www/ajs;
    index index.html;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ajs_api_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_req zone=ajs_public_api burst=60 nodelay;
    limit_conn ajs_public_conn 20;
    limit_conn ajs_public_total 400;
    client_max_body_size 2m;

    ssl_certificate     /etc/letsencrypt/live/ajs.dwgx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajs.dwgx.top/privkey.pem;

    # The API access log is separate from the portal/admin one and carries
    # timing only: method + path from $request, never a header. Never log the
    # Authorization header: the customer's key would land on disk.
    access_log /var/log/nginx/ajs-api.access.log main;

    # Edge limits, server-wide so every proxied location inherits them.
    # ajs_public_api is deliberately looser than the daemon's 60/min per-key
    # bucket so the daemon's JSON error and Retry-After stay authoritative;
    # ajs_public_total bounds the single-process Go daemon globally.

    # Long-running operations: POST /v1/accounts/{id}/actions/select-node
    # accepts timeoutSeconds up to 120, so the built-in 60s read timeout would
    # cut the connection before the daemon's own 504 OPERATION_TIMEOUT. The SSE
    # location overrides this with 1h.
    proxy_read_timeout 150s;

    # Edge liveness only, static and token-free. The daemon's /healthz reports
    # global account counts and is never proxied on this origin.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /llms.txt {
        try_files $uri =404;
        default_type text/plain;
    }

    location = /docs {
        try_files /index.html =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = / {
        return 302 /docs;
    }

    # Admin-only account subpaths. The {id} regex below cannot match them
    # (it excludes the method, not the name), but they are denied explicitly so
    # the intent survives a future regex edit.
    location = /v1/accounts/export      { return 404; }
    location = /v1/accounts/import      { return 404; }
    location = /v1/accounts/bulk-delete { return 404; }

    # --- exact scoped paths ------------------------------------------------
    # Global reads. A restricted (gate-capable) key is refused these by the
    # daemon, not by the edge; the scope check stays in one place.
    location = /metrics {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/metrics {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/accounts {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/accounts/io/capabilities {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/audit {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/audit/export.csv {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/debug/stream {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/debug/trace {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/events {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    # Server-sent events: never buffered, never cut at the normal read timeout.
    location = /v1/events/stream {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/health/nodes {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/leases {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/nodes {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/operations {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/renewal/plans {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/requests {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/schedules {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    # Its own exact block: /v1/schedules/preview sits under the {id} shape but
    # is GET/POST only. Without this block the regex would allow PATCH/DELETE
    # here and the daemon would answer 405 instead of the documented contract.
    location = /v1/schedules/preview {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/settings {
        limit_except GET PATCH { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/topology {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location = /v1/usage {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    # --- {id} shapes -------------------------------------------------------
    # nginx matches exact `=` blocks first, then these regexes in order. Each
    # regex is anchored and its variable segment excludes `/`, so no shape can
    # swallow a longer path. The three account denies above win over the bare
    # {id} regex by exact-match precedence.
    location ~ ^/v1/accounts/([^/]+)/actions/connect$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/actions/disconnect$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/actions/login$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/actions/logout$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/actions/reconnect$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/actions/select-node$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/device$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/selection$ {
        limit_except GET PUT DELETE { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)/servers$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/accounts/([^/]+)$ {
        limit_except GET PATCH DELETE { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/leases/([^/]+)/actions/rotate$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/leases/([^/]+)$ {
        limit_except GET DELETE { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/nodes/([^/]+)/actions/drain$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/nodes/([^/]+)/actions/probe$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/nodes/([^/]+)/actions/undrain$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/operations/([^/]+)$ {
        limit_except GET DELETE { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/renewal/accounts/([^/]+)$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/schedules/([^/]+)/actions/run$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/schedules/([^/]+)/runs$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    location ~ ^/v1/schedules/([^/]+)$ {
        limit_except GET PATCH DELETE { deny all; }
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd;
    }

    # Everything else: the admin namespace, the portal, the payment callbacks,
    # the OpenAPI document, whoami. A scoped key never sees them from here.
    location / {
        return 404;
    }
}
