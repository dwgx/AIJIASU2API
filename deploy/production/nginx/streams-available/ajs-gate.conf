# AJS public data plane: TLS-terminated HTTP CONNECT for the loopback gate.
#
# Backend: every node's HTTP CONNECT listener, 127.0.0.1:(gatePort + 1000),
# i.e. 14000-14010 beside the SOCKS5 gate on 13000-13010. That listener only
# exists when ajs-accountd runs with AJS_GATE_HTTP=1; the offset is
# AJS_GATE_HTTP_OFFSET (default 1000). Without it every server below accepts
# the TLS handshake and then closes, because nothing is listening on the
# backend. The daemon never binds a public address: all three of its loopback
# checks stay in force (gate/server.go validateListen,
# validateBoundLoopback and the per-peer check in gate/http.go), and nginx is
# the only public socket.
#
# Client: an HTTPS proxy that speaks CONNECT, naming the lease port:
#
#   https://<user>:<ajs_sk_...>@api.example.com:<leasePort>
#
# <user> is the panel user id, <ajs_sk_...> is a scoped key carrying
# proxy:connect, and <leasePort> is the gatePort in GET /v1/leases/{id}. The
# same number is the public TLS port and the SOCKS5 gate port; the backend is
# that number + 1000. The key must belong to <user>, allow the gate's account
# and have an active lease on it. nginx never reads the credential: the stream
# module relays bytes, so Proxy-Authorization reaches the gate untouched and
# never appears in an nginx log.
#
# Not exposed here: the SOCKS5 gate (127.0.0.1:13000-13010), the admin origin
# (127.0.0.1:8443) and the daemon API (127.0.0.1:2261). Only the HTTP CONNECT
# listener is published, and only through TLS 1.2/1.3. There is no plaintext
# gate port and no SOCKS5 on this edge.
#
# Listen address: this host's public IPv4 address, never 0.0.0.0 and never
# 127.0.0.1. ajs-accountd already owns 127.0.0.1:13000-13010 for the SOCKS5
# gate; a wildcard listen on the same numbers fails with EADDRINUSE (or, if
# nginx starts first, pushes the daemon's allocator to 13011+ and breaks this
# map). Replace 203.0.113.10 (RFC 5737 documentation address) with the address
# api.example.com resolves to. Add `listen [::]:<port> ssl;` beside each line
# on an IPv6-enabled host.
#
# Install as /etc/nginx/streams-enabled/ajs-gate.conf. Rollout and rollback:
# copy the file, `nginx -t`, `systemctl reload nginx`; rollback is removing the
# file and reloading. No daemon restart, no certificate change (this reuses the
# api.example.com pair, a SAN on the panel certificate) and no data change.

# Lease port 13000 -> loopback HTTP CONNECT 14000.
server {
    listen              203.0.113.10:13000 ssl;
    ssl_certificate     /etc/ajs/tls/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/ajs/tls/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    proxy_pass            127.0.0.1:14000;
    proxy_connect_timeout 5s;
    proxy_timeout         1h;
    limit_conn            ajs_gate_conn 10;
    access_log            off;
}

