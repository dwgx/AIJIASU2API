# Operator identity forwarded to ajs-accountd.
#
# The admin vhost authenticates every request with per-operator HTTP Basic
# auth (auth_basic_user_file rendered by render-admin-htpasswd.sh). $remote_user
# is the authenticated username. Strict RBAC derives actor and role from the
# independently mapped bearer and ignores this label; legacy mode uses it only
# for audit. It never grants authority.
proxy_set_header X-AJS-Operator $remote_user;
