# Security headers shared by both AJS origins. Include this snippet at every
# level that declares its own add_header (nginx does not inherit add_header
# into a location that defines one).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy. One policy for both origins; never add a second CSP
# header (two policies intersect, so a stale duplicate silently breaks the
# bundle). `style-src 'unsafe-inline'` is required by the existing React style
# attributes (dashboard/src/components/Sidebar.tsx and the other pages); it is
# a style-only allowance. script-src stays 'self' with no 'unsafe-inline' and
# no 'unsafe-eval', and the policy names no remote origin: the dashboard entry
# (dashboard/index.html) loads an external module and has no inline script.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
