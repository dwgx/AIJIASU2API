# Shared TLS policy for both AJS origins. The certificate pair is declared in
# each server block because the portal and admin origins use different names.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:AJS_SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout          5s;
