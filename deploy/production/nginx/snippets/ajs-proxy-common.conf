# Reverse-proxy headers for ajs-accountd.
#
# TRUSTED-PROXY NOTE
# ------------------
# nginx is the only trusted proxy in front of the daemon. The daemon trusts
# X-Forwarded-For only when the direct peer is listed in AJS_TRUSTED_PROXIES;
# set it to 127.0.0.1,::1 (the loopback addresses nginx connects from), never
# to a public CIDR or 0.0.0.0/0.
#
# This block OVERWRITES X-Forwarded-For with the socket peer. It deliberately
# does not use $proxy_add_x_forwarded_for: appending would preserve a
# client-supplied leftmost entry, and the daemon reads the first entry as the
# client IP for rate limiting. If a load balancer or CDN is later placed in
# front of this nginx, enable ngx_http_realip_module with an exact
# `set_real_ip_from <lb-cidr>; real_ip_header X-Forwarded-For; real_ip_recursive on;`
# so $remote_addr becomes the real client, then keep this overwrite.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
