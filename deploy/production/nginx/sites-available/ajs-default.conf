# Default-deny listeners for every Host this kit does not serve.
#
# Three origins are served (portal, public API, private admin); every other
# Host lands here. Without an explicit default_server, nginx uses the first
# server block for an address:port, so an unknown or attacker-chosen Host falls
# into the customer vhost and can influence a redirect or reach portal content.
# These blocks are the listener defaults for HTTP and HTTPS and must stay
# installed; the explicit default_server flag selects them regardless of
# include order.
#
# HTTP closes the connection without a response (444): scanners get no status
# and no attacker-chosen redirect target. HTTPS answers 421 Misdirected
# Request after the TLS handshake; the default certificate is the portal one,
# and no Host-dependent content is served. Owner inputs: the certificate name
# below must match the portal certificate replacement.

server {
    listen      80 default_server;
    # listen      [::]:80 default_server;   # uncomment on an IPv6-enabled host
    server_name _;
    # 444 closes the connection before any response, so these headers are never
    # sent; the include is kept so every server block carries the same set.
    include     /etc/nginx/snippets/ajs-security-headers.conf;
    return 444;
}

server {
    listen      443 ssl default_server;
    # listen      [::]:443 ssl default_server;   # uncomment on an IPv6-enabled host
    server_name _;
    ssl_certificate     /etc/ajs/tls/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/ajs/tls/panel.example.com/privkey.pem;
    include             /etc/nginx/snippets/ajs-tls.conf;
    # The 421 Misdirected Request is a real HTTP response to a browser, so it
    # carries the same security headers (including the CSP) as every origin.
    include             /etc/nginx/snippets/ajs-security-headers.conf;
    return 421;
}
