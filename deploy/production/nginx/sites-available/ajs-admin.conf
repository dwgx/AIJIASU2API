# Admin origin — loopback or VPN only.
#
# The listener itself is bound to 127.0.0.1:8443. Reach it through an SSH
# tunnel (`ssh -L 8443:127.0.0.1:8443 user@host`) or uncomment the VPN listen
# line and bind a private address that only the VPN interface owns. The
# allow/deny block is a second, independent check: even if the listener is
# exposed by mistake, non-allowlisted peers get 403.
#
# The browser never holds an admin token. Each /v1/ request gets its
# authenticated operator's bearer from the root-only token map rendered by
# deploy/production/render-admin-operators.sh; the bundle is built without
# VITE_PANEL_TOKEN. The daemon independently enforces that token's role and
# requires X-AJS-CSRF: 1 plus an exact Origin match on every unsafe request.
#
# Every request also passes per-operator HTTP Basic auth. The htpasswd file is
# rendered by deploy/production/render-admin-htpasswd.sh from the root-only
# /etc/ajs/admin-operators inventory as root:<nginx worker group> mode 0640;
# nginx workers open auth_basic_user_file, so the worker group must be able to
# read it. nginx forwards the authenticated username as X-AJS-Operator; in
# strict RBAC the daemon derives identity and role from the bearer and ignores
# that header. Basic is an independent login layer, not the source of a role.
#
# Owner inputs: replace admin.example.com in server_name and the certificate
# paths; adjust the allow CIDRs to your VPN range.

server {
    listen      127.0.0.1:8443 ssl http2;
    # Uncomment and replace with the VPN interface address to serve the admin
    # origin on the VPN directly (the same certificate name is used):
    # listen      10.8.0.1:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/ajs/tls/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/ajs/tls/admin.example.com/privkey.pem;
    include             /etc/nginx/snippets/ajs-tls.conf;
    include             /etc/nginx/snippets/ajs-security-headers.conf;

    # Admin access policy: loopback and the VPN client range only. Never add
    # a public CIDR here; the admin origin is not an internet service.
    allow 127.0.0.1;
    allow ::1;
    allow 10.8.0.0/24;
    deny  all;

    # Per-operator HTTP Basic auth. This is deliberately at server level: the
    # SPA, the API and the SSE stream all require an operator identity before
    # nginx proxies anything. /healthz stays reachable only to an authenticated
    # operator too; monitoring should use a dedicated operator entry.
    auth_basic           "AJS admin";
    auth_basic_user_file /etc/nginx/ajs-admin.htpasswd;

    root  /var/lib/ajs/production/admin;
    index index.html;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_pass http://ajs_accountd/healthz;
    }

    # Daemon readiness for an authenticated operator. It is public on the
    # daemon (like /healthz) but the admin server's Basic auth still applies;
    # public monitoring should use the portal origin's /readyz.
    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_read_timeout 3s;
        proxy_pass http://ajs_accountd/readyz;
    }

    # SSE must not be buffered or timed out like a normal request. The
    # Authorization header is injected exactly as for the rest of /v1/.
    location = /v1/events/stream {
        limit_req zone=ajs_admin_api burst=10 nodelay;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        include /etc/nginx/snippets/ajs-admin-operator-token.conf;
        include /etc/nginx/snippets/ajs-admin-operator.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://ajs_accountd;
    }

    location /v1/ {
        limit_req  zone=ajs_admin_api burst=30 nodelay;
        limit_conn ajs_conn 40;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        include /etc/nginx/snippets/ajs-admin-operator-token.conf;
        include /etc/nginx/snippets/ajs-admin-operator.conf;
        proxy_pass http://ajs_accountd;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ajs-security-headers.conf;
    }

    location = /favicon.ico { try_files $uri =404; access_log off; }
    location = /favicon.svg { try_files $uri =404; access_log off; }

    # Full operator SPA. Only reachable from an allowed peer.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ajs-security-headers.conf;
    }
}
