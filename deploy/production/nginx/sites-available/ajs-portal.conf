# Customer portal origin — public internet.
#
# Serves the token-free dashboard bundle and only the /portal* routes. The
# admin SPA routes (/accounts, /settings, ...) are not routed on this origin:
# any other path returns 404, so a customer can never land in the operator
# console even though the same static bundle is used on the admin origin.
#
# Owner inputs: replace panel.example.com in server_name and in the two
# certificate paths below; point DNS A/AAAA at this host; put the certificate
# pair at /etc/ajs/tls/panel.example.com/.

server {
    listen      80;
    # listen      [::]:80;   # uncomment on an IPv6-enabled host
    server_name panel.example.com;

    # Let the ACME client answer http-01 challenges before redirecting.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        # Fixed canonical origin, never $host: an unknown or attacker-chosen
        # Host must not influence a redirect. Unknown Hosts never reach this
        # block because ajs-default.conf owns the default_server listener.
        return 301 https://panel.example.com$request_uri;
    }
}

server {
    listen      443 ssl http2;
    # listen      [::]:443 ssl http2;   # uncomment on an IPv6-enabled host
    server_name panel.example.com;

    ssl_certificate     /etc/ajs/tls/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/ajs/tls/panel.example.com/privkey.pem;
    include             /etc/nginx/snippets/ajs-tls.conf;
    include             /etc/nginx/snippets/ajs-security-headers.conf;

    root  /var/lib/ajs/production/portal;
    index index.html;

    # Edge health check, independent of the daemon: liveness only. It stays
    # 200 while nginx serves the static site even if the daemon is down.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API readiness: proxied to the daemon, which reports state-write and
    # configured-integration checks and answers 503 when a required one fails.
    # Keep this separate from /healthz so an edge liveness probe cannot hide a
    # dead API.
    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        proxy_set_header Authorization "";
        proxy_read_timeout 3s;
        proxy_pass http://ajs_accountd;
    }

    # The portal is a same-origin SPA. Its client calls /v1/portal/* and the
    # two payment callbacks below; nothing else is proxied on this origin.
    location = /v1/portal/login {
        limit_req zone=ajs_portal_auth burst=5 nodelay;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    location = /v1/portal/signup {
        limit_req zone=ajs_portal_auth burst=3 nodelay;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    location = /v1/portal {
        limit_req  zone=ajs_portal_api burst=10 nodelay;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    location /v1/portal/ {
        limit_req  zone=ajs_portal_api burst=60 nodelay;
        limit_conn ajs_conn 20;
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    # Payment provider callbacks. These are server-to-server; the daemon
    # verifies the signature, so the proxy only forwards them.
    location = /v1/payments/epay/notify {
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    location = /v1/payments/stripe {
        include /etc/nginx/snippets/ajs-proxy-common.conf;
        # The customer origin never carries an admin bearer; strip any
        # client-supplied Authorization before it reaches the daemon.
        proxy_set_header Authorization "";
        proxy_pass http://ajs_accountd;
    }

    # Token-free bundle: /portal, /portal/login, /portal/signup, /portal/pending.
    location = /portal {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ajs-security-headers.conf;
    }

    location /portal/ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ajs-security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ajs-security-headers.conf;
    }

    location = /favicon.ico { try_files $uri =404; access_log off; }
    location = /favicon.svg { try_files $uri =404; access_log off; }

    location = / {
        return 302 /portal;
    }

    # Everything else is not part of the customer surface. In particular the
    # admin API (/v1/accounts, /v1/nodes, ...) is never proxied here.
    location / {
        return 404;
    }
}
