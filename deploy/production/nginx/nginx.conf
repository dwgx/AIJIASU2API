# AJS production nginx master configuration.
#
# Install as /etc/nginx/nginx.conf (Debian/Ubuntu layout). The two sites live in
# /etc/nginx/sites-enabled/ and are included below. Nothing here contains a
# secret: the admin bearer is injected from /etc/nginx/snippets/ajs-admin-token.conf,
# which is rendered at install time from a template and never committed.
#
# Test without installing: bash deploy/production/check.sh

user  www-data;
worker_processes  auto;
pid  /run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/ajs-mime.types;
    default_type  application/octet-stream;

    log_format  ajs_main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  ajs_main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 2m;

    # TLS defaults. Certificates and keys are set per server block.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:AJS_SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Rate-limit zones. These are the edge limits; ajs-accountd keeps its own
    # per-IP portal buckets (120/min global, 5/min signup, 10/min login).
    # Nginx zones are deliberately a little higher so the daemon's Retry-After
    # and JSON error remain the authority for portal clients.
    limit_req_zone  $binary_remote_addr  zone=ajs_portal_auth:10m  rate=12r/m;
    limit_req_zone  $binary_remote_addr  zone=ajs_portal_api:10m   rate=120r/m;
    limit_req_zone  $binary_remote_addr  zone=ajs_admin_api:10m    rate=60r/m;
    limit_conn_zone $binary_remote_addr  zone=ajs_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # The daemon listens on loopback only. Keepalive keeps the reverse proxy
    # cheap; the daemon is single-host by design.
    upstream ajs_accountd {
        server 127.0.0.1:2261;
        keepalive 16;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Only the two AJS origins are served. A request with an unknown Host hits
    # no server block and gets nginx's default; add a default_server that
    # returns 444 if this host serves anything else.
    include /etc/nginx/sites-enabled/*.conf;
}
