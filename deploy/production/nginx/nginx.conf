# AJS production nginx master configuration.
#
# Install as /etc/nginx/nginx.conf (Debian/Ubuntu layout). The site configs live in
# /etc/nginx/sites-enabled/ and are included below. Nothing here contains a
# secret: per-operator bearers are injected from the root-only
# /etc/nginx/snippets/ajs-admin-tokens.map rendered at install time.
#
# Test without installing: sudo -E bash deploy/production/check.sh

user  www-data;
worker_processes  auto;
pid  /run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/ajs-mime.types;
    default_type  application/octet-stream;

    log_format  ajs_main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  ajs_main;

    # Public API access log. Timing and upstream status are what abuse triage
    # and a slow-operation report need; $request is method + path only. Never
    # add the Authorization header or any other request header: the customer's
    # key would be written to disk.
    log_format  ajs_api   '$remote_addr - [$time_local] "$request" '
                          '$status $body_bytes_sent request_time=$request_time '
                          'upstream_time=$upstream_response_time '
                          'upstream_status=$upstream_status '
                          '"$http_user_agent"';

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 2m;

    # TLS defaults. Certificates and keys are set per server block.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:AJS_SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Rate-limit zones. These are the edge limits; ajs-accountd keeps its own
    # per-IP portal buckets (120/min global, 5/min signup, 10/min login).
    # Nginx zones are deliberately a little higher so the daemon's Retry-After
    # and JSON error remain the authority for portal clients.
    limit_req_zone  $binary_remote_addr  zone=ajs_portal_auth:10m  rate=12r/m;
    limit_req_zone  $binary_remote_addr  zone=ajs_portal_api:10m   rate=120r/m;
    limit_req_zone  $binary_remote_addr  zone=ajs_admin_api:10m    rate=60r/m;
    limit_conn_zone $binary_remote_addr  zone=ajs_conn:10m;

    # Public API edge (ajs-api.conf). The per-IP request budget is deliberately
    # above the daemon's 60/min per-key bucket so the daemon's JSON error and
    # Retry-After stay authoritative; ajs_public_total bounds the single Go
    # daemon across all sources. Never key a zone on the Authorization header:
    # it would copy customer secrets into shared memory with unbounded
    # cardinality.
    limit_req_zone  $binary_remote_addr  zone=ajs_public_api:10m   rate=120r/m;
    limit_conn_zone $binary_remote_addr  zone=ajs_public_conn:10m;
    limit_conn_zone $server_name         zone=ajs_public_total:1m;

    limit_req_status  429;
    limit_conn_status 429;

    # The daemon listens on loopback only. Keepalive keeps the reverse proxy
    # cheap; the daemon is single-host by design.
    upstream ajs_accountd {
        server 127.0.0.1:2261;
        keepalive 16;
    }

    # Maps the authenticated Basic username to that person's independent API
    # credential. The root-only map is rendered by render-admin-operators.sh.
    # No user input selects a key; an unknown name has no default credential.
    map $remote_user $ajs_operator_authorization {
        default "";
        include /etc/nginx/snippets/ajs-admin-tokens.map;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Three AJS origins are served: the public portal, the public API and the
    # private admin origin. ajs-default.conf installs explicit default_server
    # listeners: HTTP closes an unknown Host with 444, HTTPS answers 421
    # Misdirected Request. Never let an unknown Host fall through to the first
    # named vhost.
    include /etc/nginx/sites-enabled/*.conf;
}
